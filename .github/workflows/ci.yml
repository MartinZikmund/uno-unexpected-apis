name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 11.0.x
  PROJECT: src/UnexpectedApis/UnexpectedApis.csproj

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test src/UnexpectedApis.Tests/UnexpectedApis.Tests.csproj -c Release

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop
            os: ubuntu-latest
            tfm: net11.0-desktop
          - name: WebAssembly
            os: ubuntu-latest
            tfm: net11.0-browserwasm
            workloads: wasm-tools
          - name: Android
            os: ubuntu-latest
            tfm: net11.0-android
            workloads: android
          - name: Windows
            os: windows-latest
            tfm: net11.0-windows10.0.26100
          - name: iOS
            os: xcode-27
            tfm: net11.0-ios
            workloads: ios
            # A simulator build needs no signing identity.
            args: -p:RuntimeIdentifier=iossimulator-arm64
          - name: tvOS
            os: xcode-27
            tfm: net11.0-tvos
            workloads: tvos
            args: -p:RuntimeIdentifier=tvossimulator-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4
        if: matrix.name == 'Android'
        with:
          distribution: microsoft
          java-version: 21

      # .NET 11's Apple SDK needs Xcode 27.2: macos-26 images stop at 26.6, so use the
      # xcode-27 image and select its newest Xcode 27.
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install workloads
        if: matrix.workloads
        run: dotnet workload install ${{ matrix.workloads }}

      - name: Build
        # Restore evaluates every target framework, so narrow the project to one.
        run: dotnet build ${{ env.PROJECT }} -p:TargetFrameworks=${{ matrix.tfm }} -c Release ${{ matrix.args }}
